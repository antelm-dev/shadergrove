name: Beta release

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: Optional beta version for recovery (for example, 2.0.0-beta.1). Leave empty for automatic numbering.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  version:
    name: Prepare beta release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Release listings include drafts only for tokens with push access.
      contents: write
    outputs:
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # renovate: datasource=node-version depName=node
          node-version: '26.5.0'
      - name: Test beta release routing and recovery
        run: node --test .github/scripts/releases.test.mjs .github/scripts/beta-release.test.mjs
      - name: Resolve build version and existing release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node .github/scripts/beta-release.mjs

  validate:
    name: Validate beta commit
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # renovate: datasource=node-version depName=node
          node-version: '26.5.0'
          cache: pnpm

      - name: Set build version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/release-version.sh beta "$VERSION" --write

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, check, typecheck, test and build
        run: pnpm run ci

  sbom:
    name: Beta inventories
    needs: [version, validate]
    uses: ./.github/workflows/dependency-security.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}

  desktop:
    name: Publish desktop beta
    needs: [version, validate, sbom]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      sha: ${{ needs.version.outputs.sha }}
      tag: ${{ needs.version.outputs.tag }}
      channel: beta
      linux: ${{ vars.DESKTOP_LINUX_RELEASE_ENABLED == 'true' }}
      macos: ${{ vars.DESKTOP_MACOS_RELEASE_ENABLED == 'true' }}
    secrets: inherit
