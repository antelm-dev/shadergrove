name: Beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer beta version (for example, 1.1.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # renovate: datasource=node-version depName=node
          node-version: '26.5.0'
          cache: pnpm

      - name: Set build version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-version.sh beta "$VERSION" --write

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, check, typecheck, test and build
        run: pnpm run ci

  sbom:
    name: Beta inventories
    needs: validate
    uses: ./.github/workflows/dependency-security.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ inputs.version }}

  desktop:
    name: Publish desktop beta
    needs: [validate, sbom]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      sha: ${{ github.sha }}
      tag: v${{ inputs.version }}
      channel: beta
      linux: ${{ vars.DESKTOP_LINUX_RELEASE_ENABLED == 'true' }}
      macos: ${{ vars.DESKTOP_MACOS_RELEASE_ENABLED == 'true' }}
    secrets: inherit
