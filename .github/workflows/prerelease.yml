name: Beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer beta version (for example, 1.1.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'
          cache: pnpm

      - name: Set build version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-version.sh beta "$VERSION" --write

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, check, typecheck, test and build
        run: pnpm run ci

  desktop:
    name: Publish desktop beta
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      sha: ${{ github.sha }}
      tag: v${{ inputs.version }}
      channel: beta
      linux: ${{ vars.DESKTOP_LINUX_RELEASE_ENABLED == 'true' }}
      macos: ${{ vars.DESKTOP_MACOS_RELEASE_ENABLED == 'true' }}
    secrets: inherit
