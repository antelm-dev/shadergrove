name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Finish publishing an existing draft release (for example, v2.0.0). Leave empty to run Release Please.
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.target.outputs.created }}
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}

    steps:
      - name: Create or update release pull request
        id: release
        if: ${{ !inputs.tag }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # A rerun cannot rely on Release Please reporting `release_created` again,
      # so recovery names the tag and publishes whatever commit it points at,
      # provided that commit is on master.
      - name: Resolve release target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            SHA="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            STATUS="$(gh api "repos/$GH_REPO/compare/master...$SHA" --jq .status)"
            [[ "$STATUS" == identical || "$STATUS" == behind ]] || {
              echo "$TAG points at $SHA, which is not on master"
              exit 1
            }
            CREATED=true
          fi
          {
            echo "created=${CREATED:-false}"
            echo "tag=$TAG"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate tagged commit
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'
          cache: pnpm

      - name: Check release version
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: bash .github/scripts/release-version.sh stable "${TAG#v}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, check, typecheck, test and build
        run: pnpm run ci

  desktop:
    name: Publish desktop release
    needs: [version, validate]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      sha: ${{ needs.version.outputs.sha }}
      tag: ${{ needs.version.outputs.tag }}
      channel: stable
      linux: ${{ vars.DESKTOP_LINUX_RELEASE_ENABLED == 'true' }}
      macos: ${{ vars.DESKTOP_MACOS_RELEASE_ENABLED == 'true' }}
    secrets: inherit
