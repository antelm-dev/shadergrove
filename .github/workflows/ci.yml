name: CI

on:
  push:
    branches: [main, master, develop, preview]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Installs the exact pnpm from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Matches the `volta.node` pin; `engines` also allows 22 and 24.
          node-version: '26.5.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Check i18n · fonts · ipc
        run: pnpm check

      - name: Typecheck
        run: pnpm gen:ipc && pnpm typecheck:scripts && pnpm nx affected -t typecheck --exclude shadergrove

      - name: Test
        run: pnpm nx affected -t test --exclude shadergrove

      - name: Build
        # Desktop packaging has its own Windows job below.
        run: pnpm nx affected -t build --exclude shadergrove

      - name: Production SSR smoke
        run: pnpm build && pnpm smoke:ssr

  smoke:
    name: UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # `window.electron` is typed via desktop main/preload → apps/studio/src/desktop/contracts/ipc-bridge.ts
      # (gitignored). Without this, ng serve hits noImplicitAny on bridge callbacks.
      - name: Generate IPC bridge
        run: pnpm gen:ipc
      - name: Install Chromium
        run: pnpm --filter @shadergrove/workspace-tools exec playwright install chromium --with-deps
      - name: Smoke
        run: pnpm smoke

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The e2e target also depends on gen:ipc; done here so a failure points at the bridge.
      - name: Generate IPC bridge
        run: pnpm gen:ipc
      - name: Install Chromium
        run: pnpm --filter @shadergrove/studio-e2e exec playwright install chromium --with-deps
      - name: E2E
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            apps/studio-e2e/playwright-report/
            apps/studio-e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build --tag shadergrove:ci .

  deploy-staging:
    name: Deploy staging
    needs: [check, smoke, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.45-155-170-120.sslip.io/
    timeout-minutes: 5

    steps:
      - name: Queue deployment in Dokploy
        env:
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$STAGING_DEPLOY_SSH_KEY"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$STAGING_DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          printf '%s\n' '45.155.170.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINlDcFcMXfjYBWoMisJPzl+Bg2AOUgx/yX2nQPA+YJal' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "$key" root@45.155.170.120 "$GITHUB_SHA"

  desktop:
    name: Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.5.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Package unpacked application
        run: pnpm pack:win
      - name: Upload preview application
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
        uses: actions/upload-artifact@v4
        with:
          name: shadergrove-preview-${{ github.sha }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
