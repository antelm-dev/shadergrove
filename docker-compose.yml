services:
  postgres:
    image: postgres:16-alpine
    container_name: shader-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shader_studio}
      POSTGRES_USER: ${POSTGRES_USER:-shader_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    # No host port is published: only the app container reaches PostgreSQL, on
    # the internal Compose network. Add a `ports:` mapping yourself if you need
    # to connect from the host for maintenance.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-shader_studio} -d ${POSTGRES_DB:-shader_studio}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Stable service/container names let existing deployments upgrade in place.
  shader-studio:
    build: .
    image: shadergrove:latest
    container_name: shader-studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${SHADER_PORT:-4000}:4000'
    environment:
      # Selects PostgreSQL. The credentials never reach the browser.
      DATABASE_URL: postgres://${POSTGRES_USER:-shader_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shader_studio}
      # Hosts the SSR engine will answer for. Add your machine name or domain when
      # you reach the app as something other than localhost:
      #   SHADER_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],nas.local,shaders.example.com
      NG_ALLOWED_HOSTS: ${SHADER_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      # Marks this a production deployment: Secure cookies and HSTS, and a
      # refusal to start on a missing auth secret rather than a silent fallback
      # to a development one.
      NODE_ENV: production
      # Authentication. The first three are required — see .env.example.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set (see .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set (see .env.example)}
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:?MAIL_SMTP_URL must be set (see .env.example)}
      MAIL_FROM: ${MAIL_FROM:-Shadergrove <no-reply@localhost>}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      AUTH_REGISTRATION: ${AUTH_REGISTRATION:-open}
      # Optional. Empty means "use the built-in default" — see .env.example.
      AUTH_REQUIRE_VERIFIED_EMAIL: ${AUTH_REQUIRE_VERIFIED_EMAIL:-}
      AUTH_SESSION_IDLE_SECONDS: ${AUTH_SESSION_IDLE_SECONDS:-}
      AUTH_SESSION_MAX_SECONDS: ${AUTH_SESSION_MAX_SECONDS:-}
      AUTH_CHECK_COMPROMISED_PASSWORDS: ${AUTH_CHECK_COMPROMISED_PASSWORDS:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      # Secure cookies and HSTS only mean anything behind TLS, which is the
      # proxy's job. Set TRUST_PROXY=1 once a proxy you control is in front.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Public Explore, off unless set to 1 — see .env.example.
      PUBLIC_EXPLORE_ENABLED: ${PUBLIC_EXPLORE_ENABLED:-0}
      PUBLIC_EXPLORE_ADMIN_USER_IDS: ${PUBLIC_EXPLORE_ADMIN_USER_IDS:-}
    # A legacy file library can be mounted read-only to import it once via the
    # `migrate` profile below. It is NOT the primary store anymore.
    # volumes:
    #   - ./legacy-data:/legacy-data:ro

  # One-shot legacy import. Run explicitly, never on normal startup:
  #   docker compose --profile migrate run --rm migrate --source=/legacy-data
  migrate:
    profiles: ['migrate']
    image: shadergrove:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shader_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shader_studio}
    volumes:
      - ./legacy-data:/legacy-data:ro
    entrypoint: ['node', 'dist/shadergrove/cli.mjs', 'migrate-files']
    command: ['--source=/legacy-data']

  # Hands the shaders that predate authentication to a real account. Sign that
  # account up in the app first, then run this once:
  #   docker compose --profile claim run --rm claim --email=you@example.com
  # Add --dry-run to see the count without moving anything.
  claim:
    profiles: ['claim']
    image: shadergrove:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shader_studio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shader_studio}
    entrypoint: ['node', 'dist/shadergrove/cli.mjs', 'claim-shaders']

volumes:
  postgres-data:
