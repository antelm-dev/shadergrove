# Stable installer identity so Shadergrove upgrades existing Shader Studio installations.
appId: com.adelterki.shaderstudio
productName: Shadergrove
# Same mark as the website favicon (groveSvg, grove palette, 3 × 3), rendered at 1024 px.
icon: apps/studio/icons/icon.png
directories:
  output: release
  buildResources: public
files:
  - dist-main/**
  - dist-web/**
  - package.json
  - '!node_modules/**/*'
asar: true
generateUpdatesFilesForAllChannels: true
extraResources:
  - from: i18n
    to: i18n
npmRebuild: false
win:
  target:
    - nsis
    - portable
  executableName: shadergrove
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: shadergrove
  category: Development
  maintainer: Adel Terki
  artifactName: ${name}-${version}-${arch}.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: ${name}-${version}-${arch}.${ext}
  hardenedRuntime: true
  forceCodeSigning: true
  notarize: true
publish:
  provider: github
  owner: antelm-dev
  repo: shadergrove
  channel: latest
  releaseType: release
